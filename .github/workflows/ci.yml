name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  contracts:
    name: Public contracts mirror
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Validate mirror fixtures
        working-directory: contracts
        run: |
          npm ci
          npm run test:contracts
          npm run check:compatibility

  go-sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Build and test Go SDK
        working-directory: sdk/go
        run: |
          go build ./...
          go test ./...
      - name: Build go-verify example
        working-directory: examples/go-verify
        run: go build ./...

  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        working-directory: sdk/python
        run: python -m unittest discover -s tests -v

  typescript-sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Install and test
        working-directory: sdk/typescript
        run: |
          npm ci
          npm test
          npm run test:types

  sdk-parity:
    name: Cross-SDK digest parity and version lockstep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Build TypeScript SDK
        working-directory: sdk/typescript
        run: npm ci && npm run build
      - name: Verify SDK versions are in lockstep
        run: |
          ROOT_VERSION=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
          PY_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('sdk/python/pyproject.toml','rb'))['project']['version'])")
          TS_VERSION=$(node -e "console.log(require('./sdk/typescript/package.json').version)")
          echo "root=$ROOT_VERSION python=$PY_VERSION typescript=$TS_VERSION"
          [ "$ROOT_VERSION" = "$PY_VERSION" ] || { echo "version drift: root $ROOT_VERSION != python $PY_VERSION" >&2; exit 1; }
          [ "$ROOT_VERSION" = "$TS_VERSION" ] || { echo "version drift: root $ROOT_VERSION != typescript $TS_VERSION" >&2; exit 1; }
      - name: Run cross-SDK parity check
        run: bash sdk/cross-sdk-parity.sh
